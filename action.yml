name: 'Fast Setup Node.js'
description: >-
  Fast Node.js setup for GitHub Actions (Yarn 4, npm, pnpm). Caches linked
  node_modules and skips install completely on an exact cache hit.

branding:
  icon: 'zap'
  color: 'yellow'

inputs:
  node-version:
    description: 'Node.js version spec to install (defaults to 24 when node-version-file is not set)'
    required: false
    default: ''
  node-version-file:
    description: 'File containing the Node.js version spec (e.g. .nvmrc, .node-version, package.json)'
    required: false
    default: ''
  working-directory:
    description: 'Working directory containing package.json and lockfile'
    required: false
    default: '.'
  cache-key-prefix:
    description: 'Optional prefix added to cache keys to scope or bust caches (e.g. per Node ABI for native addons)'
    required: false
    default: ''
  cache-paths:
    description: 'Multiline glob patterns passed to actions/cache for the linked dependency tree (defaults to **/node_modules excluding nested node_modules, plus .yarn/install-state.gz for Yarn)'
    required: false
    default: ''
  manifest-paths:
    description: 'Multiline glob patterns passed to hashFiles() for the node_modules cache key (defaults to the package manager lockfile, config files, and **/package.json excluding node_modules/.yarn/.git)'
    required: false
    default: ''

outputs:
  cache-hit:
    description: 'Whether node_modules was restored from cache ("true") or installed ("false")'
    value: ${{ steps.cache-node-modules.outputs.cache-hit == 'true' && 'true' || 'false' }}
  node-version:
    description: 'The installed Node.js version'
    value: ${{ steps.setup-node.outputs.node-version }}
  package-manager:
    description: 'The resolved package manager ("yarn", "npm", or "pnpm")'
    value: ${{ steps.detect.outputs.package-manager }}

runs:
  using: 'composite'
  steps:
    - name: Detect package manager and cache configuration
      id: detect
      shell: bash
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_CACHE_PATHS: ${{ inputs.cache-paths }}
        INPUT_MANIFEST_PATHS: ${{ inputs.manifest-paths }}
      run: |
        node -e '
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const os = require("node:os");
          const path = require("node:path");

          function fail(msg) {
            console.log(`::error::${msg}`);
            process.exit(1);
          }

          const wdRaw = process.env.INPUT_WORKING_DIRECTORY || ".";
          const wd = wdRaw.replace(/[/\\]+$/, "") || ".";
          if (!fs.existsSync(wd) || !fs.statSync(wd).isDirectory()) {
            fail(`working-directory "${wd}" does not exist.`);
          }

          const pkgPath = path.join(wd, "package.json");
          let pmSpec = "";
          if (fs.existsSync(pkgPath)) {
            let pkg;
            try {
              pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            } catch (err) {
              fail(`Failed to parse ${pkgPath}: ${err.message}`);
            }
            if (typeof pkg.packageManager === "string" && pkg.packageManager.trim() !== "") {
              pmSpec = pkg.packageManager.trim();
            }
          }

          let pm = "";
          let useCorepack = false;
          let corepackKey = "";
          let corepackHome = "";
          let shimDir = "";

          if (pmSpec) {
            const at = pmSpec.indexOf("@");
            if (at <= 0 || at === pmSpec.length - 1) {
              fail(`Invalid "packageManager" field "${pmSpec}" in ${pkgPath}. Expected "<name>@<version>" (e.g. "yarn@4.18.1" or "pnpm@10.28.2").`);
            }
            const name = pmSpec.slice(0, at);
            if (name === "yarn" || name === "pnpm") {
              pm = name;
              useCorepack = true;
              const label = pmSpec.split("+")[0].replace(/[^a-zA-Z0-9._-]/g, "-");
              const hash = crypto.createHash("sha256").update(pmSpec).digest("hex").slice(0, 16);
              corepackKey = `${label}-${hash}`;
              corepackHome = process.env.COREPACK_HOME || path.join(
                process.env.XDG_CACHE_HOME ?? process.env.LOCALAPPDATA ?? path.join(os.homedir(), process.platform === "win32" ? "AppData/Local" : ".cache"),
                "node",
                "corepack"
              );
              shimDir = path.join(process.env.RUNNER_TEMP || os.tmpdir(), "fast-setup-node-shims");
              fs.mkdirSync(shimDir, { recursive: true });
            } else if (name === "npm") {
              pm = "npm";
            } else {
              fail(`Unsupported packageManager "${pmSpec}" in ${pkgPath}. Supported package managers are yarn, npm, and pnpm.`);
            }
          } else {
            if (fs.existsSync(path.join(wd, "yarn.lock"))) {
              fail(`Found yarn.lock in "${wd}" without a "packageManager" field in package.json. Add "packageManager": "yarn@<version>" to package.json so Corepack activates the pinned Yarn version.`);
            }
            if (fs.existsSync(path.join(wd, "pnpm-lock.yaml"))) {
              fail(`Found pnpm-lock.yaml in "${wd}" without a "packageManager" field in package.json. Add "packageManager": "pnpm@<version>" to package.json so Corepack activates the pinned pnpm version.`);
            }
            if (fs.existsSync(path.join(wd, "npm-shrinkwrap.json")) || fs.existsSync(path.join(wd, "package-lock.json"))) {
              pm = "npm";
            } else {
              fail(`Could not detect package manager in "${wd}". Add "packageManager" to package.json (yarn/pnpm) or commit a lockfile (package-lock.json or npm-shrinkwrap.json for npm).`);
            }
          }

          const wdPosix = wd.replace(/\\/g, "/");
          let lockfile;
          let defaultCachePaths;
          let defaultManifestPaths;

          if (pm === "yarn") {
            lockfile = `${wdPosix}/yarn.lock`;
            defaultCachePaths = [
              `${wdPosix}/**/node_modules`,
              `!${wdPosix}/**/node_modules/**/node_modules`,
              `${wdPosix}/.yarn/install-state.gz`,
            ].join("\n");
            defaultManifestPaths = [
              `${wdPosix}/yarn.lock`,
              `${wdPosix}/.yarnrc.yml`,
              `${wdPosix}/**/package.json`,
              `!${wdPosix}/**/node_modules/**`,
              `!${wdPosix}/.yarn/**`,
              `!${wdPosix}/.git/**`,
            ].join("\n");
          } else if (pm === "pnpm") {
            lockfile = `${wdPosix}/pnpm-lock.yaml`;
            defaultCachePaths = [
              `${wdPosix}/**/node_modules`,
              `!${wdPosix}/**/node_modules/**/node_modules`,
            ].join("\n");
            defaultManifestPaths = [
              `${wdPosix}/pnpm-lock.yaml`,
              `${wdPosix}/pnpm-workspace.yaml`,
              `${wdPosix}/.npmrc`,
              `${wdPosix}/**/package.json`,
              `!${wdPosix}/**/node_modules/**`,
              `!${wdPosix}/.git/**`,
            ].join("\n");
          } else {
            lockfile = fs.existsSync(path.join(wd, "npm-shrinkwrap.json"))
              ? `${wdPosix}/npm-shrinkwrap.json`
              : `${wdPosix}/package-lock.json`;
            defaultCachePaths = [
              `${wdPosix}/**/node_modules`,
              `!${wdPosix}/**/node_modules/**/node_modules`,
            ].join("\n");
            defaultManifestPaths = [
              lockfile,
              `${wdPosix}/.npmrc`,
              `${wdPosix}/**/package.json`,
              `!${wdPosix}/**/node_modules/**`,
              `!${wdPosix}/.git/**`,
            ].join("\n");
          }

          const cachePaths = (process.env.INPUT_CACHE_PATHS || "").trim() || defaultCachePaths;
          const manifestPaths = (process.env.INPUT_MANIFEST_PATHS || "").trim() || defaultManifestPaths;
          const delim = `EOF_${crypto.randomBytes(8).toString("hex")}`;

          const lines = [
            `package-manager=${pm}`,
            `use-corepack=${useCorepack}`,
            `corepack-home=${corepackHome}`,
            `corepack-key=${corepackKey}`,
            `shim-dir=${shimDir}`,
            `lockfile=${lockfile}`,
            `cache-paths<<${delim}\n${cachePaths}\n${delim}`,
            `manifest-paths<<${delim}\n${manifestPaths}\n${delim}`,
          ];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, lines.join("\n") + "\n");
        '

    # Exact-key lookup for the linked node_modules tree. No restore-keys:
    # reconciling a stale node_modules is slower than a clean install from the
    # package manager download cache.
    - name: Restore node_modules cache
      id: cache-node-modules
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.detect.outputs.cache-paths }}
        key: >-
          ${{ inputs.cache-key-prefix != '' && format('{0}-', inputs.cache-key-prefix) || '' }}node-modules-${{ steps.detect.outputs.package-manager }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(steps.detect.outputs.manifest-paths) }}

    # Restore Corepack's downloaded package manager cache so warm jobs invoke
    # the pinned yarn/pnpm version without hitting the registry.
    - name: Restore Corepack cache
      id: cache-corepack
      if: steps.detect.outputs.use-corepack == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.detect.outputs.corepack-home }}
        key: >-
          ${{ inputs.cache-key-prefix != '' && format('{0}-', inputs.cache-key-prefix) || '' }}corepack-${{ runner.os }}-${{ runner.arch }}-${{ steps.detect.outputs.corepack-key }}

    # Create Corepack shims before actions/setup-node so the runner's system
    # Corepack is captured even when setup-node installs Node >= 25 (no bundled
    # Corepack). Shims are written into a dedicated directory that is prepended
    # to GITHUB_PATH after setup-node, shadowing any global yarn/pnpm on PATH.
    - name: Enable Corepack shim
      id: enable-corepack
      if: steps.detect.outputs.use-corepack == 'true'
      shell: bash
      env:
        PM: ${{ steps.detect.outputs.package-manager }}
        SHIM_DIR: ${{ steps.detect.outputs.shim-dir }}
      run: |
        if command -v corepack >/dev/null 2>&1; then
          corepack enable --install-directory "$SHIM_DIR" "$PM"
          printf 'enabled=true\n' >> "$GITHUB_OUTPUT"
        else
          printf 'enabled=false\n' >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Node.js
      id: setup-node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version || (inputs.node-version-file == '' && '24' || '') }}
        node-version-file: ${{ inputs.node-version-file }}
        package-manager-cache: false

    - name: Activate Corepack shim on PATH
      if: steps.detect.outputs.use-corepack == 'true'
      shell: bash
      env:
        PM: ${{ steps.detect.outputs.package-manager }}
        SHIM_DIR: ${{ steps.detect.outputs.shim-dir }}
        ALREADY_ENABLED: ${{ steps.enable-corepack.outputs.enabled }}
      run: |
        if [ "$ALREADY_ENABLED" != "true" ]; then
          if command -v corepack >/dev/null 2>&1; then
            corepack enable --install-directory "$SHIM_DIR" "$PM"
          else
            echo "::error::Corepack is required to activate '$PM' from packageManager in package.json, but corepack was not found on PATH."
            exit 1
          fi
        fi
        node -e "require('node:fs').appendFileSync(process.env.GITHUB_PATH, process.env.SHIM_DIR + '\n')"

    - name: Populate Corepack cache
      if: steps.detect.outputs.use-corepack == 'true' && steps.cache-corepack.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PM: ${{ steps.detect.outputs.package-manager }}
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: |
        "$PM" --version

    - name: Save Corepack cache
      if: steps.detect.outputs.use-corepack == 'true' && steps.cache-corepack.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.detect.outputs.corepack-home }}
        key: ${{ steps.cache-corepack.outputs.cache-primary-key }}

    - name: Resolve package manager cache folder
      id: pm-cache-dir
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PM: ${{ steps.detect.outputs.package-manager }}
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: |
        case "$PM" in
          yarn)
            cache_dir="$(yarn config get cacheFolder | tail -n 1 | tr -d '\r')"
            ;;
          pnpm)
            cache_dir="$(pnpm store path | tail -n 1 | tr -d '\r')"
            ;;
          npm)
            cache_dir="$(npm config get cache | tail -n 1 | tr -d '\r')"
            ;;
        esac
        printf 'path=%s\n' "$cache_dir" >> "$GITHUB_OUTPUT"

    - name: Restore package manager cache
      id: cache-pm
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pm-cache-dir.outputs.path }}
        key: >-
          ${{ inputs.cache-key-prefix != '' && format('{0}-', inputs.cache-key-prefix) || '' }}${{ steps.detect.outputs.package-manager }}-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(steps.detect.outputs.lockfile) }}
        restore-keys: |
          ${{ inputs.cache-key-prefix != '' && format('{0}-', inputs.cache-key-prefix) || '' }}${{ steps.detect.outputs.package-manager }}-cache-${{ runner.os }}-${{ runner.arch }}-

    # On Yarn public PRs, hardened mode re-verifies every package resolution
    # against the registry (+3-7s). When HEAD is a PR merge commit
    # (fetch-depth >= 2) and yarn.lock and .yarnrc.yml are unchanged from the
    # base commit (HEAD^1), the lockfile is already trusted and --immutable
    # still rejects any package.json drift.
    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PM: ${{ steps.detect.outputs.package-manager }}
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: |
        case "$PM" in
          yarn)
            if [ -z "${YARN_ENABLE_HARDENED_MODE:-}" ] \
              && [ "$GITHUB_EVENT_NAME" = "pull_request" ] \
              && git rev-parse --verify --quiet HEAD^2 >/dev/null 2>&1 \
              && git diff --quiet HEAD^1 -- yarn.lock .yarnrc.yml 2>/dev/null; then
              export YARN_ENABLE_HARDENED_MODE=false
            fi
            yarn install --immutable
            ;;
          pnpm)
            pnpm install --frozen-lockfile --prefer-offline
            ;;
          npm)
            npm ci --prefer-offline --no-audit --no-fund
            ;;
        esac

    # Save immediately after install (before test/build steps write into
    # node_modules caches) so cache-hit jobs skip post-job saves entirely.
    - name: Save node_modules cache
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.detect.outputs.cache-paths }}
        key: ${{ steps.cache-node-modules.outputs.cache-primary-key }}

    - name: Save package manager cache
      if: steps.cache-node-modules.outputs.cache-hit != 'true' && steps.cache-pm.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pm-cache-dir.outputs.path }}
        key: ${{ steps.cache-pm.outputs.cache-primary-key }}

    # Expose workspace binaries (vitest, eslint, tsc, turbo, ...) on PATH so
    # subsequent steps can invoke them directly without package manager overhead.
    - name: Add node_modules/.bin to PATH
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node -e "const fs = require('node:fs'); const p = require('node:path').resolve('node_modules/.bin'); if (fs.existsSync(p)) fs.appendFileSync(process.env.GITHUB_PATH, p + '\n')"

name: 'Fast Setup Node.js'
description: >-
  Fast Node.js setup for GitHub Actions (Yarn 4, npm, pnpm). Caches linked
  node_modules and skips install completely on an exact cache hit.

branding:
  icon: 'zap'
  color: 'yellow'

inputs:
  node-version:
    description: 'Node.js version spec to install (defaults to 24 when node-version-file is not set)'
    required: false
    default: ''
  node-version-file:
    description: 'File containing the Node.js version spec (e.g. .nvmrc, .node-version, package.json)'
    required: false
    default: ''
  package-manager:
    description: 'Package manager to use: auto, yarn, npm, or pnpm (defaults to auto-detecting from packageManager field and lockfiles)'
    required: false
    default: 'auto'
  enable-package-manager:
    description: 'Ensure the package manager CLI shim (yarn/pnpm via Corepack) is enabled even on a node_modules cache hit (npm is always available via Node.js)'
    required: false
    default: 'false'
  working-directory:
    description: 'Working directory containing package.json and lockfile'
    required: false
    default: '.'
  cache-key-prefix:
    description: 'Optional prefix added to cache keys to scope or bust caches (e.g. per Node ABI for native addons)'
    required: false
    default: ''
  cache-paths:
    description: 'Multiline glob patterns passed to actions/cache for the linked dependency tree (defaults to **/node_modules excluding nested node_modules, plus .yarn/install-state.gz for Yarn)'
    required: false
    default: ''
  manifest-paths:
    description: 'Multiline glob patterns passed to hashFiles() for the node_modules cache key (defaults to the package manager lockfile, config files, and **/package.json excluding node_modules/.yarn/.git)'
    required: false
    default: ''

outputs:
  cache-hit:
    description: 'Whether node_modules was restored from cache ("true") or installed ("false")'
    value: ${{ steps.cache-node-modules.outputs.cache-hit == 'true' && 'true' || 'false' }}
  node-version:
    description: 'The installed Node.js version'
    value: ${{ steps.setup-node.outputs.node-version }}
  package-manager:
    description: 'The resolved package manager ("yarn", "npm", or "pnpm")'
    value: ${{ steps.detect.outputs.package-manager }}

runs:
  using: 'composite'
  steps:
    - name: Detect package manager and cache configuration
      id: detect
      shell: bash
      env:
        INPUT_PACKAGE_MANAGER: ${{ inputs.package-manager }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_CACHE_PATHS: ${{ inputs.cache-paths }}
        INPUT_MANIFEST_PATHS: ${{ inputs.manifest-paths }}
      run: |
        wd="${INPUT_WORKING_DIRECTORY:-.}"
        while [ "${#wd}" -gt 1 ] && [ "${wd%/}" != "$wd" ]; do
          wd="${wd%/}"
        done

        if [ ! -d "$wd" ]; then
          echo "::error::working-directory '$wd' does not exist."
          exit 1
        fi

        pm="${INPUT_PACKAGE_MANAGER:-auto}"
        if [ "$pm" = "auto" ]; then
          if [ -f "$wd/package.json" ]; then
            declared="$(node -e 'try { const pm = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).packageManager; if (typeof pm === "string") console.log(pm.split("@")[0]); } catch {}' "$wd/package.json" 2>/dev/null || true)"
            case "$declared" in
              yarn|npm|pnpm) pm="$declared" ;;
            esac
          fi

          if [ "$pm" = "auto" ]; then
            if [ -f "$wd/pnpm-lock.yaml" ]; then
              pm="pnpm"
            elif [ -f "$wd/yarn.lock" ]; then
              pm="yarn"
            elif [ -f "$wd/npm-shrinkwrap.json" ] || [ -f "$wd/package-lock.json" ]; then
              pm="npm"
            else
              echo "::error::Could not detect package manager in '$wd'. Commit a lockfile (yarn.lock, package-lock.json, npm-shrinkwrap.json, or pnpm-lock.yaml), set packageManager in package.json, or pass the package-manager input."
              exit 1
            fi
          fi
        fi

        case "$pm" in
          yarn)
            lockfile="$wd/yarn.lock"
            default_cache_paths="$(printf '%s/**/node_modules\n!%s/**/node_modules/**/node_modules\n%s/.yarn/install-state.gz' "$wd" "$wd" "$wd")"
            default_manifest_paths="$(printf '%s/yarn.lock\n%s/.yarnrc.yml\n%s/**/package.json\n!%s/**/node_modules/**\n!%s/.yarn/**\n!%s/.git/**' "$wd" "$wd" "$wd" "$wd" "$wd" "$wd")"
            ;;
          pnpm)
            lockfile="$wd/pnpm-lock.yaml"
            default_cache_paths="$(printf '%s/**/node_modules\n!%s/**/node_modules/**/node_modules' "$wd" "$wd")"
            default_manifest_paths="$(printf '%s/pnpm-lock.yaml\n%s/pnpm-workspace.yaml\n%s/.npmrc\n%s/**/package.json\n!%s/**/node_modules/**\n!%s/.git/**' "$wd" "$wd" "$wd" "$wd" "$wd" "$wd")"
            ;;
          npm)
            if [ -f "$wd/npm-shrinkwrap.json" ]; then
              lockfile="$wd/npm-shrinkwrap.json"
            else
              lockfile="$wd/package-lock.json"
            fi
            default_cache_paths="$(printf '%s/**/node_modules\n!%s/**/node_modules/**/node_modules' "$wd" "$wd")"
            default_manifest_paths="$(printf '%s\n%s/.npmrc\n%s/**/package.json\n!%s/**/node_modules/**\n!%s/.git/**' "$lockfile" "$wd" "$wd" "$wd" "$wd")"
            ;;
          *)
            echo "::error::Unsupported package-manager '$pm'. Expected 'auto', 'yarn', 'npm', or 'pnpm'."
            exit 1
            ;;
        esac

        cache_paths="${INPUT_CACHE_PATHS:-$default_cache_paths}"
        manifest_paths="${INPUT_MANIFEST_PATHS:-$default_manifest_paths}"

        delim="__FAST_SETUP_NODE_EOF__"
        {
          printf 'package-manager=%s\n' "$pm"
          printf 'lockfile=%s\n' "$lockfile"
          printf 'cache-paths<<%s\n%s\n%s\n' "$delim" "$cache_paths" "$delim"
          printf 'manifest-paths<<%s\n%s\n%s\n' "$delim" "$manifest_paths" "$delim"
        } >> "$GITHUB_OUTPUT"

    # Exact-key lookup for the linked node_modules tree. No restore-keys:
    # reconciling a stale node_modules is slower than a clean install from the
    # package manager download cache.
    - name: Restore node_modules cache
      id: cache-node-modules
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.detect.outputs.cache-paths }}
        key: >-
          ${{ inputs.cache-key-prefix != '' && format('{0}-', inputs.cache-key-prefix) || '' }}node-modules-${{ steps.detect.outputs.package-manager }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(steps.detect.outputs.manifest-paths) }}

    # Enable Corepack before actions/setup-node so the runner's system Corepack
    # shim is wired even when setup-node installs Node >= 25 (no bundled Corepack).
    - name: Enable Corepack shim (Unix)
      if: >-
        runner.os != 'Windows'
        && steps.detect.outputs.package-manager != 'npm'
        && (
          inputs.enable-package-manager == 'true'
          || steps.cache-node-modules.outputs.cache-hit != 'true'
        )
      shell: bash
      env:
        PM: ${{ steps.detect.outputs.package-manager }}
      run: |
        if command -v corepack >/dev/null 2>&1; then
          corepack enable "$PM"
        elif ! command -v "$PM" >/dev/null 2>&1; then
          echo "::error::Neither corepack nor '$PM' is available on PATH."
          exit 1
        fi

    - name: Enable Corepack shim (Windows)
      if: >-
        runner.os == 'Windows'
        && steps.detect.outputs.package-manager != 'npm'
        && (
          inputs.enable-package-manager == 'true'
          || steps.cache-node-modules.outputs.cache-hit != 'true'
        )
      shell: bash
      env:
        PM: ${{ steps.detect.outputs.package-manager }}
      run: |
        if command -v corepack >/dev/null 2>&1; then
          if [ -d 'C:\npm\prefix' ]; then
            corepack enable --install-directory 'C:\npm\prefix' "$PM"
          else
            corepack enable "$PM"
          fi
        elif ! command -v "$PM" >/dev/null 2>&1; then
          echo "::error::Neither corepack nor '$PM' is available on PATH."
          exit 1
        fi

    - name: Setup Node.js
      id: setup-node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version || (inputs.node-version-file == '' && '24' || '') }}
        node-version-file: ${{ inputs.node-version-file }}
        package-manager-cache: false

    - name: Resolve package manager cache folder
      id: pm-cache-dir
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PM: ${{ steps.detect.outputs.package-manager }}
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: |
        case "$PM" in
          yarn)
            cache_dir="$(yarn config get cacheFolder | tail -n 1 | tr -d '\r')"
            ;;
          pnpm)
            cache_dir="$(pnpm store path | tail -n 1 | tr -d '\r')"
            ;;
          npm)
            cache_dir="$(npm config get cache | tail -n 1 | tr -d '\r')"
            ;;
        esac
        printf 'path=%s\n' "$cache_dir" >> "$GITHUB_OUTPUT"

    - name: Restore package manager cache
      id: cache-pm
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pm-cache-dir.outputs.path }}
        key: >-
          ${{ inputs.cache-key-prefix != '' && format('{0}-', inputs.cache-key-prefix) || '' }}${{ steps.detect.outputs.package-manager }}-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(steps.detect.outputs.lockfile) }}
        restore-keys: |
          ${{ inputs.cache-key-prefix != '' && format('{0}-', inputs.cache-key-prefix) || '' }}${{ steps.detect.outputs.package-manager }}-cache-${{ runner.os }}-${{ runner.arch }}-

    # On Yarn public PRs, hardened mode re-verifies every package resolution
    # against the registry (+3-7s). When HEAD is a PR merge commit
    # (fetch-depth >= 2) and yarn.lock and .yarnrc.yml are unchanged from the
    # base commit (HEAD^1), the lockfile is already trusted and --immutable
    # still rejects any package.json drift.
    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PM: ${{ steps.detect.outputs.package-manager }}
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: |
        case "$PM" in
          yarn)
            if [ -z "${YARN_ENABLE_HARDENED_MODE:-}" ] \
              && [ "$GITHUB_EVENT_NAME" = "pull_request" ] \
              && git rev-parse --verify --quiet HEAD^2 >/dev/null 2>&1 \
              && git diff --quiet HEAD^1 -- yarn.lock .yarnrc.yml 2>/dev/null; then
              export YARN_ENABLE_HARDENED_MODE=false
            fi
            yarn install --immutable
            ;;
          pnpm)
            pnpm install --frozen-lockfile --prefer-offline
            ;;
          npm)
            npm ci --prefer-offline --no-audit --no-fund
            ;;
        esac

    # Save immediately after install (before test/build steps write into
    # node_modules caches) so cache-hit jobs skip post-job saves entirely.
    - name: Save node_modules cache
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.detect.outputs.cache-paths }}
        key: ${{ steps.cache-node-modules.outputs.cache-primary-key }}

    - name: Save package manager cache
      if: steps.cache-node-modules.outputs.cache-hit != 'true' && steps.cache-pm.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pm-cache-dir.outputs.path }}
        key: ${{ steps.cache-pm.outputs.cache-primary-key }}

    # Expose workspace binaries (vitest, eslint, tsc, turbo, ...) on PATH so
    # subsequent steps can invoke them directly without package manager overhead.
    - name: Add node_modules/.bin to PATH
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node -e "const fs = require('node:fs'); const p = require('node:path').resolve('node_modules/.bin'); if (fs.existsSync(p)) fs.appendFileSync(process.env.GITHUB_PATH, p + '\n')"
